# Cenário de Partição de Rede Temporária
# O nó 3 é isolado dos nós 1 e 2 aos 3 segundos, e a partição é curada aos 8 segundos.
# Duração de 15 s: depois da cura sobra mais que o prazo de convergência do Bully (5 s com os
# padrões), para o verificador de logs conferir a convergência (docs/testes.md).
name: "particao_rede"
description: "Isola o nó 3 dos nós 1 e 2 temporariamente e restaura a conectividade"
duration_s: 15.0
seed: 1001

events:
  - time_s: 3.0
    action: "partition"
    nodes: [1, 2]
    target: 3

  - time_s: 8.0
    action: "heal"
    nodes: [1, 2]
    target: 3
