# Ambiente de referência: N nós lógicos em uma única máquina (Docker Compose v2).
# Cada nó = contêiner independente; comunicação somente via rede HTTP/JSON (porta 8000).
# Os nós 4 e 5 ficam no perfil "n5"; use ./scripts/env.sh up5, que também ajusta PEERS para 5 nós.
# O cliente do serviço de tarefas (issue #8) fica no perfil "integracao": ele gera carga por
# DURACAO_S segundos e grava results/logs/cliente.jsonl (docs/integracao.md).
# As portas são publicadas só em 127.0.0.1: o /control não tem autenticação e não pode
# ficar acessível a outras máquinas. Dentro da rede do compose o nó escuta em 0.0.0.0 (BIND_ADDR).

x-node: &node
  build: .
  image: mc714-node
  networks: [mc714]
  volumes:
    - ./results/logs:/app/results/logs
  restart: "no"

x-env: &env
  PEERS: "${PEERS:-1=node1:8000,2=node2:8000,3=node3:8000}"
  BIND_ADDR: "0.0.0.0"
  PORT: "8000"
  SEED: "${SEED:-1001}"
  LOG_DIR: /app/results/logs
  RPC_TIMEOUT: "${RPC_TIMEOUT:-1.0}"
  PING_INTERVAL: "${PING_INTERVAL:-1.0}"
  HB_INTERVAL: "${HB_INTERVAL:-0.5}"
  HB_TIMEOUT: "${HB_TIMEOUT:-2.0}"
  NET_DROP_PROB: "${NET_DROP_PROB:-0}"
  NET_DELAY_MS: "${NET_DELAY_MS:-0}"
  NET_JITTER_MS: "${NET_JITTER_MS:-0}"
  NET_DUP_PROB: "${NET_DUP_PROB:-0}"

services:
  node1:
    <<: *node
    container_name: mc714-node1
    ports: ["127.0.0.1:8001:8000"]
    environment: {<<: *env, NODE_ID: "1"}
  node2:
    <<: *node
    container_name: mc714-node2
    ports: ["127.0.0.1:8002:8000"]
    environment: {<<: *env, NODE_ID: "2"}
  node3:
    <<: *node
    container_name: mc714-node3
    ports: ["127.0.0.1:8003:8000"]
    environment: {<<: *env, NODE_ID: "3"}
  node4:
    <<: *node
    container_name: mc714-node4
    profiles: [n5]
    ports: ["127.0.0.1:8004:8000"]
    environment: {<<: *env, NODE_ID: "4"}
  node5:
    <<: *node
    container_name: mc714-node5
    profiles: [n5]
    ports: ["127.0.0.1:8005:8000"]
    environment: {<<: *env, NODE_ID: "5"}
  cliente:
    <<: *node
    container_name: mc714-cliente
    profiles: [integracao]
    command: ["python", "-m", "src.cliente"]
    healthcheck: {disable: true}   # não é um nó: não tem /health
    # nenhuma porta publicada: só fala com os nós pela rede do compose
    environment:
      PEERS: "${PEERS:-1=node1:8000,2=node2:8000,3=node3:8000}"
      LOG_DIR: /app/results/logs
      RPC_TIMEOUT: "${RPC_TIMEOUT:-1.0}"
      TAXA: "${TAXA:-20}"
      DURACAO_S: "${DURACAO_S:-30}"
      TAREFA_MS: "${TAREFA_MS:-100}"
    depends_on:
      node1: {condition: service_healthy}
      node2: {condition: service_healthy}
      node3: {condition: service_healthy}

networks:
  mc714:
    driver: bridge

